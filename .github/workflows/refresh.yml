name: Refresh data and deploy

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run collect
      - run: npm run history:verify
      - name: Summary
        if: always()
        run: |
          echo "## Collector report" >> $GITHUB_STEP_SUMMARY
          cat reports/match-report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Window: $(node -e "console.log(require('./public/data/usage.json').window.end)")" >> $GITHUB_STEP_SUMMARY
          echo "History: $(node -e "const i=require('./public/data/history/index.json');console.log(i.days.length+' days, last '+ (i.days.at(-1)||{}).date)")" >> $GITHUB_STEP_SUMMARY
      - name: Compute base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then echo "path=/" >> $GITHUB_OUTPUT; else echo "path=/$REPO/" >> $GITHUB_OUTPUT; fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit history
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/history
          git diff --cached --quiet || git commit -m "chore: archive daily usage history [skip ci]"
          git push

  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
